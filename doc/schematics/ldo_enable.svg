<text x="-800.0" y="-789.0" font-family="Helvetica,Arial,sans-serif" font-size="17.0" font-weight="bold" fill="#1a202c">ldo_enable -- enable / power-gate with 1.2 V to 3.3 V level shift</text>
<text x="-800.0" y="-754.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">The control bus is 1.2 V and the pass device sits on 3.3 V. A 1.2 V signal cannot</text>
<text x="-800.0" y="-738.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">turn a 3.3 V PMOS off, so the high side is level-shifted. Killing the bias alone is</text>
<text x="-800.0" y="-722.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">not enough: with the mirrors off nothing drives eout, and a floating pass gate can</text>
<text x="-800.0" y="-706.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">drift low and turn the device ON. Mdis forces eout to vin so 'disabled' really is.</text>
