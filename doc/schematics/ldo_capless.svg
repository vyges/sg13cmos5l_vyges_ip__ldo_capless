<text x="-1150.0" y="-648.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">Signal path: vref_bg (1.2 V harness bandgap) -&gt; ldo_vref halves it to 0.6 V -&gt; ldo_erramp</text>
<text x="-1150.0" y="-632.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">compares against vfb -&gt; eout drives the ldo_pass PMOS array -&gt; vout -&gt; ldo_fbtrim divides</text>
<text x="-1150.0" y="-616.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">back to vfb with 5-bit trim.  Cc is the Miller compensation around the pass device; Cout is</text>
<text x="-1150.0" y="-600.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">the on-chip stabilising capacitor that replaces the external one this topology does without.</text>
