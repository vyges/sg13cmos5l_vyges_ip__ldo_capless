<text x="-900.0" y="-733.0" font-family="Helvetica,Arial,sans-serif" font-size="17.0" font-weight="bold" fill="#1a202c">ldo_pgood -- power-good comparator (lv domain, 1.2 V logic out)</text>
<text x="-900.0" y="-698.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">Both inputs sit at ~0.6 V. That is BELOW the hv threshold and comfortably above</text>
<text x="-900.0" y="-682.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">the lv one, so this comparator must be lv and must run from the 1.2 V rail --</text>
<text x="-900.0" y="-666.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">the mirror image of the error amplifier, whose inputs sit at the same voltage but</text>
<text x="-900.0" y="-650.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">which needed a PMOS pair on 3.3 V. Same constraint, opposite answer.</text>
