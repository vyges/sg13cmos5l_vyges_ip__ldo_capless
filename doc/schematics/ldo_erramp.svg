<text x="-1120.0" y="-745.0" font-family="Helvetica,Arial,sans-serif" font-size="17.0" font-weight="bold" fill="#1a202c">ldo_erramp -- 5T OTA error amplifier (sg13_hv, 3.3 V domain)</text>
<text x="-1120.0" y="-710.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">Tail current is mirrored from the harness iDAC through the ibias pin: the harness</text>
<text x="-1120.0" y="-694.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">pushes current IN and Mr develops the gate voltage locally. Do NOT substitute a local</text>
<text x="-1120.0" y="-678.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">voltage bias -- the tail is meant to track the harness iDAC scale (IB_SEL), and output</text>
<text x="-1120.0" y="-662.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">accuracy is meant to inherit the harness bandgap rather than anything generated on-slot.</text>
<text x="-1120.0" y="-632.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">Loop sense: vfb up -&gt; M1 current up -&gt; n3 down -&gt; M4 gate down -&gt; eout up</text>
<text x="-1120.0" y="-616.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">-&gt; pass PMOS turns off -&gt; vout down.  Swapping the M1/M2 gates inverts the</text>
<text x="-1120.0" y="-600.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">loop and the regulator latches to a rail.</text>
</svg>