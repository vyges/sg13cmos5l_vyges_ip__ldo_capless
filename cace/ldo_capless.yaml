#--------------------------------------------------------------
# CACE characterization for the Vyges capacitor-less LDO
#
# Limits are the published specification in README.md. The .meas definitions in the
# templates are copied verbatim from sim/tb_*.spice so this datasheet and
# chipalooza/tools/report.py cannot disagree about the same number.
#--------------------------------------------------------------

name:           ldo_capless
description:    Capacitor-less LDO for IHP SG13CMOS5L, 3.3 V in, trimmable 1.0-1.8 V out
PDK:            ihp-sg13g2
cace_format:    5.2

authorship:
  designer:      Vyges
  license:       Apache 2.0

paths:
  root:          ..
  schematic:     xschem
  templates:     cace/templates
  scripts:       cace/scripts
  netlist:       netlist
  documentation: doc/datasheet

pins:
  vin:
    description: Input supply, 3.3 V nominal
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vout:    {description: Regulated output (Kelvin sensed), type: signal, direction: output}
  vss:     {description: Ground, type: ground, direction: inout}
  vddd:    {description: 1.2 V control-bus supply, type: power, direction: inout}
  vref_bg: {description: Bandgap reference input, type: signal, direction: input}
  ibias:   {description: Bias current input from the harness, type: signal, direction: input}
  en:      {description: Enable, type: signal, direction: input}
  ilim_en: {description: Current-limit enable, type: signal, direction: input}
  pgood:   {description: Power-good status, type: signal, direction: output}
  oc:      {description: Over-current status, type: signal, direction: output}
  vtrim0:  {description: Output trim bit 0 (LSB), type: signal, direction: input}
  vtrim1:  {description: Output trim bit 1, type: signal, direction: input}
  vtrim2:  {description: Output trim bit 2, type: signal, direction: input}
  vtrim3:  {description: Output trim bit 3, type: signal, direction: input}
  vtrim4:  {description: Output trim bit 4 (MSB), type: signal, direction: input}

default_conditions:
  vin:
    description: Input supply voltage
    display: Vin
    unit: V
    typical: 3.3
  temperature:
    description: Ambient temperature
    display: Temp
    unit: C
    typical: 27
  mos_corner:
    description: MOS process corner
    display: MOS
    typical: mos_tt
  res_corner:
    description: Resistor process corner
    display: RES
    typical: res_typ

parameters:
  dc_regulation:
    display: DC regulation
    spec:
      vout_op:
        display: Output voltage
        description: Regulated output at the mid trim code, 1 mA load
        unit: V
        minimum: {value: 1.1}
        typical: {value: 1.2}
        maximum: {value: 1.3}
      linereg:
        display: Line regulation
        description: Output change per volt of input, 2.9 to 3.58 V
        unit: mV/V
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: 5}
      loadreg:
        display: Load regulation
        description: Output change from no load to 48 mA
        unit: mV
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: 20}
    tool:
      ngspice:
        template: dc.spice
        format: ascii
        suffix: .data
        variables: [vout_op, linereg, loadreg]
    conditions:
      temperature:
        enumerate: [-40, 27, 125]
      mos_corner:
        enumerate: [mos_tt]
      res_corner:
        enumerate: [res_typ]
